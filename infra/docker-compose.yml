services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartkisan-postgres
    environment:
      POSTGRES_USER: smartkisan
      POSTGRES_PASSWORD: smartkisan
      POSTGRES_DB: smartkisan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartkisan -d smartkisan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartkisan-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for leaf-scan images and exported models (Phase 4).
  minio:
    image: minio/minio:latest
    container_name: smartkisan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartkisan
      MINIO_ROOT_PASSWORD: smartkisan123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.api
    container_name: smartkisan-api
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://smartkisan:smartkisan@postgres:5432/smartkisan
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    # Migrations run on boot so a fresh clone is one command away from working.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
  minio_data:
