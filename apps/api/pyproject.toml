[project]
name = "smartkisan-api"
version = "0.1.0"
description = "SmartKisan — Farmer Decision Support Platform API"
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "geoalchemy2>=0.15.0",
    # Cache
    "redis>=5.2.0",
    # Auth
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    # HTTP client
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "freezegun>=1.5.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    # This codebase intentionally contains Devanagari/Gurmukhi strings and
    # typographic dashes in docstrings and farmer-facing text.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"app/migrations/*" = ["E501", "I001"]
# N802: property tests are deliberately named test_INVARIANT_* so the
# safety-critical invariants stand out in test output and in review.
"tests/*" = ["E501", "N802"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL/Redis (skipped when unavailable)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
